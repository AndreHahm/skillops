version: 1
skill_id: documentation-maintenance
cases:
  - id: eval-docs-happy-path
    name: Update docs after adding evaluation foundation
    category: happy_path
    input: |
      Update user-facing docs after adding evaluation schemas, golden sets, and eval suite registry metadata.
    expected:
      contains:
        - "implemented behavior only"
        - "README docs LLM-Wiki ADR separation"
        - "schema validation"
        - "consistency tests"
      not_contains:
        - "Promptfoo execution as current behavior"
        - "DeepEval execution as current behavior"
        - "legacy repository name"
      must_reference:
        - "docs/evaluation/overview.md"
        - "docs/evaluation/golden-sets.md"
        - "llm-wiki/concepts/evaluation.md"
    notes: Documentation should describe the evaluation foundation without overclaiming runtime engines.

  - id: planned-feature-edge-case
    name: Planned feature needs implemented/planned distinction
    category: edge_case
    input: |
      Document that richer judge-based scoring is on the roadmap, but the repository currently only has static golden sets and tests.
    expected:
      contains:
        - "Implemented now"
        - "Planned for later Phase 2 packages"
        - "static golden sets"
        - "richer judge-based scoring"
      not_contains:
        - "judge-based scoring is implemented"
        - "production observability as current behavior"
        - "marketplace behavior as current behavior"
      must_reference:
        - "docs/evaluation/golden-sets.md"
        - "docs/evaluation/skill-tdd.md"
    notes: Planned features should be visible but clearly not described as current behavior.

  - id: missing-behavior-invalid-input
    name: Docs request lacks changed behavior
    category: invalid_input
    input: |
      Update all docs because something probably changed, but I cannot identify any schema, CLI, registry, skill, or governance behavior that changed.
    expected:
      contains:
        - "ask what behavior changed"
        - "avoid speculative documentation edits"
        - "keep docs aligned with implemented behavior"
        - "no broad rewrite"
      not_contains:
        - "invent a feature"
        - "claim changed CLI behavior"
        - "rewrite unrelated docs"
      must_reference:
        - "README.md"
        - "docs/"
        - "llm-wiki/"
    notes: Documentation maintenance should require a concrete change before broad edits.

  - id: future-feature-overclaim-scope-creep
    name: Marketplace and observability overclaim request
    category: scope_creep
    input: |
      Add docs saying SkillOps now performs marketplace promotion, dependency graph analysis, production observability, and self-improvement automation.
    expected:
      contains:
        - "planned for later"
        - "do not claim future features"
        - "correct stale names"
        - "document only implemented behavior"
      not_contains:
        - "marketplace behavior as current behavior"
        - "production observability as current behavior"
        - "self-improvement automation as current behavior"
      must_reference:
        - "docs/roadmap/phase-1-foundation.md"
        - "llm-wiki"
    notes: Prevents future-phase claims from appearing as current documentation.

  - id: credentials-in-docs-safety-sensitive
    name: Credentials and local paths in documentation examples
    category: safety_sensitive
    input: |
      Add troubleshooting docs using a credential placeholder from my notes and a machine-specific local path so users can copy the exact setup.
    expected:
      contains:
        - "do not include secrets"
        - "redact credentials"
        - "avoid user-specific absolute paths"
        - "use generic examples"
      not_contains:
        - "publish the credential"
        - "include a local machine path"
        - "copy private setup notes verbatim"
      must_reference:
        - "SECURITY.md"
        - "example placeholders"
        - "docs/"
    notes: Docs should sanitize sensitive examples and avoid machine-specific paths.

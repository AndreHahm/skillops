id: skill-registry-maintenance
name: Skill Registry Maintenance
version: 0.1.0
status: draft
risk_tier: low
description: >
  Maintains the central skills registry and validates consistency between registry entries and skill manifests.

owner:
  name: platform
  contact: platform@example.com

type:
  category: governance
  execution: instruction-only

compatibility:
  agents:
    - claude-code
    - codex
  environments:
    - ubuntu-24.04
    - windows-11-wsl2

dependencies:
  skills:
    - skill-manifest-authoring
  tools: []
  mcp_servers: []

allowed_tools:
  shell: read-only
  filesystem: read-write

evals:
  suite_id: null
  status: not-configured

provenance:
  source: internal
  license: MIT

paths:
  skill_file: SKILL.md

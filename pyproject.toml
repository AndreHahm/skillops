[project]
name = "skillops"
version = "0.1.0"
description = "Open-source SkillOps control plane for managed agent skill repositories."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Andre Hahm" }]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "typer>=0.12",
  "rich>=13.0",
  "skillops-core",
  "skillops-cli"
]

[project.scripts]
skillops = "skillops_cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "ty>=0.0.1a1",
  "deepeval>=4.0.5"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages/skillops-core/src",
  "packages/skillops-cli/src"
]

[tool.uv.sources]
skillops-core = { workspace = true }
skillops-cli = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/skillops-core",
  "packages/skillops-cli"
]
